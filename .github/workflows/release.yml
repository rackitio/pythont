# Stable channel: builds only when the Python version changes.
#
# Runs on every push to main that touches the Dockerfile; it publishes only
# if PYTHON_VERSION has no vX.Y.Z git tag yet. Version bumps normally
# arrive as a PR from python-update.yml -- merging that PR is the release.
# Publishes X.Y.Z, X.Y, stable, latest (and resets X.Y.Z-weekly / weekly to
# the same image), then creates the vX.Y.Z tag + GitHub release with notes
# listing the Debian package and CVE changes.
#
# Run manually (Actions -> release -> Run workflow) to rebuild the current
# version's stable tags, e.g. after a failed run.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — Docker Hub username (also used as the image namespace)
#   DOCKERHUB_TOKEN    — Docker Hub access token with Read & Write scope
name: release

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Has this Python version been released?
        id: check
        run: |
          ver="$(sed -n 's/^ENV PYTHON_VERSION=//p' Dockerfile)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Manual run: rebuilding stable for $ver"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already released; Dockerfile change goes out with the next weekly build"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Python version $ver: releasing stable"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
    secrets: inherit
